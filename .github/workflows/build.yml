name: Build debug APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the legacy "tools" package, which
          # Google has removed from the SDK repository (sdkmanager now fails with "Failed to
          # find package 'tools'" on every fresh runner) -- not something this build ever
          # needed: Gradle resolves whatever platform/build-tools versions it needs itself via
          # its own dependency management. This failed at SDK setup, before any app code was
          # even touched, so unrelated to the commit it first showed up on.
          packages: ""

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: paralleye-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
